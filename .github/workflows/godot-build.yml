# Builds the Godot version of PokéPop (the godot/ folder) for every platform.
# Pull requests: download the builds from the run's "Artifacts" list.
# Pushes to main also:
#   - replace the "latest" release, so the downloads live at
#     https://github.com/williamschertzer/pokepop/releases/latest
#   - publish the web build to GitHub Pages, with the original web version
#     under /classic/ (Settings → Pages → Source must be "GitHub Actions")
name: Build Godot game

on:
  push:
    branches: [main]
  pull_request:
    paths: ["godot/**", ".github/workflows/godot-build.yml", ".github/pages/**"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

concurrency:
  group: godot-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: godot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-v1

      - name: Install Godot and export templates
        run: |
          if [ ! -x ~/godot-bin/godot ]; then
            mkdir -p ~/godot-bin
            curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d ~/godot-bin
            mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/version.txt" ]; then
            mkdir -p "$T"
            curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q -j /tmp/templates.tpz 'templates/version.txt' 'templates/web_nothreads_*' 'templates/linux_*.x86_64' 'templates/windows_*_x86_64*' 'templates/macos.zip' 'templates/android_*.apk' -d "$T"
            rm /tmp/templates.tpz
          fi
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import project and point Godot at the Android SDK
        run: |
          godot --headless --import
          S=~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          sed -i "s|^export/android/android_sdk_path = .*|export/android/android_sdk_path = \"${ANDROID_SDK_ROOT}\"|" "$S"
          sed -i "s|^export/android/java_sdk_path = .*|export/android/java_sdk_path = \"${JAVA_HOME}\"|" "$S"
          grep "^export/android/" "$S"

      - name: Export
        run: |
          mkdir -p build/web build/windows build/macos build/linux build/android
          godot --headless --export-release "Web" build/web/index.html
          godot --headless --export-release "Windows" build/windows/PokePop.exe
          godot --headless --export-release "macOS" build/macos/PokePop.zip
          godot --headless --export-release "Linux" build/linux/PokePop.x86_64
          godot --headless --export-debug "Android" build/android/PokePop.apk
          ls -la build/*
          test -f build/web/index.wasm
          test -f build/windows/PokePop.exe
          test -f build/macos/PokePop.zip
          test -f build/linux/PokePop.x86_64
          test -f build/android/PokePop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PokePop-Web
          path: godot/build/web
      - uses: actions/upload-artifact@v4
        with:
          name: PokePop-Windows
          path: godot/build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: PokePop-macOS
          path: godot/build/macos
      - uses: actions/upload-artifact@v4
        with:
          name: PokePop-Linux
          path: godot/build/linux
      - uses: actions/upload-artifact@v4
        with:
          name: PokePop-Android
          path: godot/build/android

      - name: Replace the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          (cd build/windows && zip -q -r ../../release/PokePop-Windows.zip .)
          cp build/macos/PokePop.zip release/PokePop-macOS.zip
          (cd build/linux && zip -q -r ../../release/PokePop-Linux.zip .)
          cp build/android/PokePop.apk release/PokePop-Android.apk
          (cd build/web && zip -q -r ../../release/PokePop-Web.zip .)
          ls -la release
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest release/* \
            --target "$GITHUB_SHA" \
            --title "PokéPop Defense (latest build)" \
            --notes "Built automatically from main at ${GITHUB_SHA::7}. Windows: unzip and run PokePop.exe. Mac: unzip and open PokePop.app (see the README for the first-launch steps). Android: install the APK. Linux: unzip and run PokePop.x86_64."

      - name: Assemble the GitHub Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          mkdir -p site/classic
          cp -r godot/build/web/. site/
          cp index.html manifest.webmanifest sw.js site/classic/
          cp -r icons site/classic/
          cp .github/pages/sw.js site/sw.js
          touch site/.nojekyll
          ls -la site site/classic

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  pages:
    needs: export
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
